target-version = "py311"
line-length = 120

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[lint.isort]
known-first-party = ["benchmarks"]

[lint.per-file-ignores]
"benchmarks/report_generator.py" = ["C4"]
"comparison/compare.py" = ["C4"]

[format]
quote-style = "double"
indent-style = "space"
